name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate distribution tooling and signing configuration
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          MACOS_DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          case "$MACOS_SIGNING_ENABLED" in
            true)
              for name in MACOS_DEVELOPER_ID_P12 MACOS_DEVELOPER_ID_PASSWORD MACOS_DEVELOPER_ID_IDENTITY APPLE_NOTARY_KEY_P8 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
                if [ -z "${!name}" ]; then
                  echo "$name is required when MACOS_SIGNING_ENABLED is true" >&2
                  exit 1
                fi
              done
              ;;
            false) ;;
            *) echo "MACOS_SIGNING_ENABLED must be true or false" >&2; exit 1 ;;
          esac
          python3 -m unittest discover -s scripts/distribution -p 'test_*.py'
          sh -n scripts/install.sh
          sh -n scripts/distribution/sign.sh
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify executable and collect license notices
        env:
          TARGET: ${{ matrix.target }}
        run: |
          "target/$TARGET/release/diskr" --help
          file "target/$TARGET/release/diskr"
          mkdir -p "$RUNNER_TEMP/binary"
          cp "target/$TARGET/release/diskr" LICENSE "$RUNNER_TEMP/binary/"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"])
          packages = json.loads((temporary / "metadata.json").read_text())["packages"]
          destination = temporary / "binary" / "licenses"
          destination.mkdir()
          index = []
          for package in packages:
              root = Path(package["manifest_path"]).parent.resolve()
              files = [entry for entry in root.iterdir() if entry.is_file() and not entry.is_symlink() and entry.name.upper().startswith(("LICENSE", "NOTICE", "COPYING", "COPYRIGHT"))]
              if package.get("license_file"):
                  candidate = (root / package["license_file"]).resolve()
                  if root in candidate.parents and candidate.is_file() and candidate not in files:
                      files.append(candidate)
              if files:
                  target = destination / (package["name"] + "-" + package["version"])
                  target.mkdir(exist_ok=True)
                  for entry in files:
                      shutil.copyfile(entry, target / entry.name)
              index.append({"package": package["name"], "version": package["version"], "license": package["license"], "repository": package["repository"], "notice_files": [entry.name for entry in files]})
          (destination / "index.json").write_text(json.dumps(index, indent=2) + "\n")
          PY
      - name: Sign and notarize the distribution
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          TARGET: ${{ matrix.target }}
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          MACOS_DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          sh scripts/distribution/sign.sh --binary-dir "$RUNNER_TEMP/binary" \
            --target "$TARGET" --output-dir "$RUNNER_TEMP"
      - name: Package the verified executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          "$RUNNER_TEMP/binary/diskr" --version
          tar -czf "$RUNNER_TEMP/diskr-$TARGET.tar.gz" -C "$RUNNER_TEMP/binary" diskr LICENSE licenses
          cd "$RUNNER_TEMP"
          shasum -a 256 "diskr-$TARGET.tar.gz" > "$TARGET.sha256"
          if [ "$MACOS_SIGNING_ENABLED" = true ]; then
            shasum -a 256 "diskr-$TARGET.dmg" >> "$TARGET.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diskr-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/diskr-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/diskr-${{ matrix.target }}.dmg
            ${{ runner.temp }}/${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: binaries
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify private maintenance docs stay untracked
        run: |
          for path in AGENTS.md CLAUDE.md docs/AUDIT.md docs/ISSUES.md; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "$path is private maintenance material and must not be tracked" >&2
              exit 1
            fi
          done
          if [ -n "$(git ls-files docs/internal)" ]; then
            echo "docs/internal is private maintenance material and must not be tracked" >&2
            exit 1
          fi
          if git grep -nE '(issue +#[0-9]+|audit finding|finding +#[0-9]+)' -- '*.rs'; then
            echo "tracked source must not expose private tracker references" >&2
            exit 1
          fi
          if git log -1 --pretty=%s | grep -Eq '(#[0-9]+|audit finding)'; then
            echo "commit subject exposes private tracker metadata" >&2
            exit 1
          fi

      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Read crate metadata
        id: meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          package = metadata["packages"][0]
          print(f"name={package['name']}")
          print(f"version={package['version']}")
          PY

      - name: Verify tag matches crate version
        env:
          CRATE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$CRATE_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $CRATE_VERSION" >&2
            exit 1
          fi

      - name: Verify release tag points to main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tags must point to a commit reachable from origin/main" >&2
            exit 1
          fi

      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked
      - run: cargo publish --dry-run --locked

      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: diskr-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Prepare verified installation assets
        env:
          CRATE_VERSION: ${{ steps.meta.outputs.version }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED || 'false' }}
        run: |
          args=()
          if [ "$MACOS_SIGNING_ENABLED" = true ]; then args+=(--signed); fi
          python3 scripts/distribution/prepare.py --version "$CRATE_VERSION" \
            --assets-dir "$RUNNER_TEMP/release-assets" --installer scripts/install.sh "${args[@]}"
          cd "$RUNNER_TEMP/release-assets"
          shasum -a 256 -c SHA256SUMS
          sh -n install-diskr.sh
          ruby -c diskr.rb

      - name: Check crates.io for existing version
        id: crates
        env:
          CRATE_NAME: ${{ steps.meta.outputs.name }}
          CRATE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          status_code="$(
            curl -s -o /dev/null -w "%{http_code}" \
              -H "User-Agent: diskr-release-workflow" \
              -H "Accept: application/json" \
              "https://crates.io/api/v1/crates/$CRATE_NAME/$CRATE_VERSION"
          )"
          if [ "$status_code" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif [ "$status_code" = "404" ]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected crates.io status: $status_code" >&2
            exit 1
          fi

      - name: Publish to crates.io
        if: steps.crates.outputs.already_published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not configured" >&2
            exit 1
          fi
          cargo publish --locked

      - name: Download published crate
        id: published
        env:
          CRATE_NAME: ${{ steps.meta.outputs.name }}
          CRATE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          crate_archive="$RUNNER_TEMP/${CRATE_NAME}-${CRATE_VERSION}.crate"
          for attempt in $(seq 1 12); do
            if curl -fsSL \
              -H "User-Agent: diskr-release-workflow" \
              -H "Accept: application/octet-stream" \
              "https://crates.io/api/v1/crates/$CRATE_NAME/$CRATE_VERSION/download" \
              -o "$crate_archive"; then
              echo "crate_archive=$crate_archive" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "published crate did not become available on crates.io" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify published crate provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CRATE_ARCHIVE: ${{ steps.published.outputs.crate_archive }}
        run: |
          python - <<'PY'
          import json
          import os
          import tarfile

          archive = os.environ["CRATE_ARCHIVE"]
          expected_sha = os.environ["EXPECTED_SHA"]

          with tarfile.open(archive, "r:gz") as tf:
              member = next(
                  (item for item in tf.getmembers() if item.name.endswith("/.cargo_vcs_info.json")),
                  None,
              )
              if member is None:
                  raise SystemExit("published crate is missing .cargo_vcs_info.json")
              with tf.extractfile(member) as fh:
                  info = json.load(fh)

          actual_sha = (info.get("git") or {}).get("sha1")
          if actual_sha != expected_sha:
              raise SystemExit(
                  f"published crate was built from {actual_sha}, expected {expected_sha}"
              )
          PY

      - name: Publish release notes and verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.escape(os.environ["CRATE_VERSION"])
          changelog = Path("CHANGELOG.md").read_text()
          match = re.search(r"^## \[" + version + r"\] - [^\n]+\n(.*?)(?=^## \[|\Z)", changelog, re.M | re.S)
          if not match or not match.group(1).strip():
              raise SystemExit("released changelog section is missing or empty")
          import json
          distribution = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release-assets" / "distribution.json").read_text())
          if distribution["apple_notarized"]:
              status = "Native executables are Developer ID signed and notarized. Disk images include verified stapled tickets; standalone binaries use Apple's online ticket lookup."
          else:
              status = "Native archives are checksum-verified but are not Developer ID signed or notarized. No security-policy bypass is required or recommended."
          (Path(os.environ["RUNNER_TEMP"]) / "release-notes.md").write_text(match.group(1).strip() + "\n\n" + status + "\n")
          PY
          cd "$RUNNER_TEMP/release-assets"
          shasum -a 256 -c SHA256SUMS
          assets=(diskr-aarch64-apple-darwin.tar.gz diskr-x86_64-apple-darwin.tar.gz SHA256SUMS install-diskr.sh diskr.rb distribution.json)
          if [ -f diskr-aarch64-apple-darwin.dmg ]; then
            assets+=(diskr-aarch64-apple-darwin.dmg diskr-x86_64-apple-darwin.dmg)
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${assets[@]}"

  refresh-site:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Validate and deploy the website after release publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
