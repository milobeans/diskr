name: Release

on:
  workflow_run:
    workflows: ["Release tag"]
    types: [completed]

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      signing: ${{ steps.tag.outputs.signing }}
    steps:
      - name: Check release request identity
        env:
          REQUEST: ${{ toJSON(github.event.workflow_run) }}
          OWNER_ID: ${{ github.repository_owner_id }}
          REPO_ID: ${{ github.repository_id }}
          RERUN_ACTOR: ${{ github.triggering_actor }}
        run: |
          jq -e --arg repo "$REPO_ID" --arg owner "$OWNER_ID" '
            .event == "push" and .conclusion == "success"
            and .path == ".github/workflows/release-tag.yml"
            and (.head_repository.id | tostring) == $repo
            and (.actor.id | tostring) == $owner
            and (.triggering_actor.id | tostring) == $owner
          ' <<< "$REQUEST" >/dev/null
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then [[ "$RERUN_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || exit 1; fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and crate version without running tagged code
        id: tag
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SIGNING: ${{ vars.MACOS_SIGNING_ENABLED || 'false' }}
          UNSIGNED_TAG: ${{ vars.MACOS_UNSIGNED_RELEASE_TAG }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse --verify "refs/tags/${TAG}^{commit}")" == "$SHA" ]] || exit 1
          git merge-base --is-ancestor "$SHA" "$GITHUB_SHA"
          git show "$SHA:Cargo.toml" > "$RUNNER_TEMP/manifest.toml"
          python3 - <<'PYTHON'
          import os, tomllib
          from pathlib import Path
          package = tomllib.loads((Path(os.environ["RUNNER_TEMP"]) / "manifest.toml").read_text())["package"]
          if package["name"] != "diskr" or "v" + package["version"] != os.environ["TAG"]:
              raise SystemExit("tag must match the diskr crate version")
          PYTHON
          case "$SIGNING" in true|false) ;; *) echo "invalid signing configuration" >&2; exit 1 ;; esac
          if [[ "$TAG" == "$UNSIGNED_TAG" ]]; then
            echo "Applying configured unsigned release exception for $TAG"
            SIGNING=false
          fi
          printf 'sha=%s\ntag=%s\nversion=%s\nsigning=%s\n' "$SHA" "$TAG" "${TAG#v}" "$SIGNING" >> "$GITHUB_OUTPUT"

  binaries:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Validate distribution tooling
        run: |
          python3 -m unittest discover -s scripts/distribution -p 'test_*.py'
          sh -n scripts/install.sh
          sh -n scripts/distribution/sign.sh
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify executable and collect license notices
        env:
          TARGET: ${{ matrix.target }}
        run: |
          "target/$TARGET/release/diskr" --help
          file "target/$TARGET/release/diskr"
          mkdir -p "$RUNNER_TEMP/binary"
          cp "target/$TARGET/release/diskr" LICENSE "$RUNNER_TEMP/binary/"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"])
          packages = json.loads((temporary / "metadata.json").read_text())["packages"]
          destination = temporary / "binary" / "licenses"
          destination.mkdir()
          index = []
          for package in packages:
              root = Path(package["manifest_path"]).parent.resolve()
              files = [entry for entry in root.iterdir() if entry.is_file() and not entry.is_symlink() and entry.name.upper().startswith(("LICENSE", "NOTICE", "COPYING", "COPYRIGHT"))]
              if package.get("license_file"):
                  candidate = (root / package["license_file"]).resolve()
                  if root in candidate.parents and candidate.is_file() and candidate not in files:
                      files.append(candidate)
              if files:
                  target = destination / (package["name"] + "-" + package["version"])
                  target.mkdir(exist_ok=True)
                  for entry in files:
                      shutil.copyfile(entry, target / entry.name)
              index.append({"package": package["name"], "version": package["version"], "license": package["license"], "repository": package["repository"], "notice_files": [entry.name for entry in files]})
          (destination / "index.json").write_text(json.dumps(index, indent=2) + "\n")
          PY
      - name: Archive the verified executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd "$RUNNER_TEMP"
          tar -czf "diskr-$TARGET.tar.gz" -C binary diskr LICENSE licenses
          shasum -a 256 "diskr-$TARGET.tar.gz" > "$TARGET.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/diskr-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: authorize
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Verify private maintenance docs stay untracked
        run: |
          for path in AGENTS.md CLAUDE.md docs/AUDIT.md docs/ISSUES.md; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "$path is private maintenance material and must not be tracked" >&2
              exit 1
            fi
          done
          if [ -n "$(git ls-files docs/internal)" ]; then
            echo "docs/internal is private maintenance material and must not be tracked" >&2
            exit 1
          fi
          if git grep -nE '(issue +#[0-9]+|audit finding|finding +#[0-9]+)' -- '*.rs'; then
            echo "tracked source must not expose private tracker references" >&2
            exit 1
          fi
          if git log -1 --pretty=%s | grep -Eq '(#[0-9]+|audit finding)'; then
            echo "commit subject exposes private tracker metadata" >&2
            exit 1
          fi

      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked
      - run: cargo publish --dry-run --locked

  sign:
    needs: [authorize, binaries, validate]
    if: needs.authorize.outputs.signing == 'true'
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/distribution
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-${{ matrix.target }}
          path: ${{ runner.temp }}
      - name: Unpack verified binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd "$RUNNER_TEMP"
          shasum -a 256 -c "$TARGET.sha256"
          mkdir binary
          tar -xzf "diskr-$TARGET.tar.gz" -C binary
      - name: Sign and notarize the distribution
        env:
          TARGET: ${{ matrix.target }}
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          MACOS_DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          sh scripts/distribution/sign.sh --binary-dir "$RUNNER_TEMP/binary" \
            --target "$TARGET" --output-dir "$RUNNER_TEMP"
      - name: Archive signed binary and checksum the disk image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd "$RUNNER_TEMP"
          tar -czf "diskr-$TARGET.tar.gz" -C binary diskr LICENSE licenses
          shasum -a 256 "diskr-$TARGET.tar.gz" "diskr-$TARGET.dmg" > "$TARGET.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/diskr-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/diskr-${{ matrix.target }}.dmg
            ${{ runner.temp }}/${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 7

  assets:
    needs: [authorize, binaries, validate, sign]
    if: >-
      !cancelled() && needs.authorize.result == 'success' && needs.binaries.result == 'success'
      && needs.validate.result == 'success' && (needs.sign.result == 'success'
      || (needs.authorize.outputs.signing == 'false' && needs.sign.result == 'skipped'))
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.authorize.outputs.signing == 'true' && 'signed-*' || 'unsigned-*' }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Prepare verified installation assets
        env:
          CRATE_VERSION: ${{ needs.authorize.outputs.version }}
          MACOS_SIGNING_ENABLED: ${{ needs.authorize.outputs.signing }}
        run: |
          args=()
          if [ "$MACOS_SIGNING_ENABLED" = true ]; then args+=(--signed); fi
          python3 scripts/distribution/prepare.py --version "$CRATE_VERSION" \
            --assets-dir "$RUNNER_TEMP/release-assets" --installer scripts/install.sh "${args[@]}"
          cd "$RUNNER_TEMP/release-assets"
          shasum -a 256 -c SHA256SUMS
          sh -n install-diskr.sh
          ruby -c diskr.rb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 7

  publish-crate:
    needs: [authorize, assets]
    if: "!cancelled() && needs.assets.result == 'success'"
    runs-on: macos-26
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Check crates.io for existing version
        id: crates
        env:
          CRATE_NAME: diskr
          CRATE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          status_code="$(
            curl -s -o /dev/null -w "%{http_code}" \
              -H "User-Agent: diskr-release-workflow" \
              -H "Accept: application/json" \
              "https://crates.io/api/v1/crates/$CRATE_NAME/$CRATE_VERSION"
          )"
          if [ "$status_code" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif [ "$status_code" = "404" ]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected crates.io status: $status_code" >&2
            exit 1
          fi

      - name: Select registry authentication
        if: steps.crates.outputs.already_published != 'true'
        id: registry
        env:
          HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Authenticate to crates.io
        if: steps.crates.outputs.already_published != 'true' && steps.registry.outputs.has_token != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the validated source to crates.io
        if: steps.crates.outputs.already_published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify
      - name: Download published crate
        id: published
        env:
          CRATE_NAME: diskr
          CRATE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          crate_archive="$RUNNER_TEMP/${CRATE_NAME}-${CRATE_VERSION}.crate"
          for attempt in $(seq 1 12); do
            if curl -fsSL \
              -H "User-Agent: diskr-release-workflow" \
              -H "Accept: application/octet-stream" \
              "https://crates.io/api/v1/crates/$CRATE_NAME/$CRATE_VERSION/download" \
              -o "$crate_archive"; then
              echo "crate_archive=$crate_archive" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "published crate did not become available on crates.io" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify published crate provenance
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
          CRATE_ARCHIVE: ${{ steps.published.outputs.crate_archive }}
        run: |
          python - <<'PY'
          import json
          import os
          import tarfile

          archive = os.environ["CRATE_ARCHIVE"]
          expected_sha = os.environ["EXPECTED_SHA"]

          with tarfile.open(archive, "r:gz") as tf:
              member = next(
                  (item for item in tf.getmembers() if item.name.endswith("/.cargo_vcs_info.json")),
                  None,
              )
              if member is None:
                  raise SystemExit("published crate is missing .cargo_vcs_info.json")
              with tf.extractfile(member) as fh:
                  info = json.load(fh)

          actual_sha = (info.get("git") or {}).get("sha1")
          if actual_sha != expected_sha:
              raise SystemExit(
                  f"published crate was built from {actual_sha}, expected {expected_sha}"
              )
          PY

  publish:
    needs: [authorize, publish-crate]
    if: "!cancelled() && needs.publish-crate.result == 'success'"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Publish release notes and verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          CRATE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.escape(os.environ["CRATE_VERSION"])
          changelog = Path("CHANGELOG.md").read_text()
          match = re.search(r"^## \[" + version + r"\] - [^\n]+\n(.*?)(?=^## \[|\Z)", changelog, re.M | re.S)
          if not match or not match.group(1).strip():
              raise SystemExit("released changelog section is missing or empty")
          import json
          distribution = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release-assets" / "distribution.json").read_text())
          if distribution["apple_notarized"]:
              status = "Native executables are Developer ID signed and notarized. Disk images include verified stapled tickets; standalone binaries use Apple's online ticket lookup."
          else:
              status = "Native archives are checksum-verified but are not Developer ID signed or notarized. No security-policy bypass is required or recommended."
          (Path(os.environ["RUNNER_TEMP"]) / "release-notes.md").write_text(match.group(1).strip() + "\n\n" + status + "\n")
          PY
          cd "$RUNNER_TEMP/release-assets"
          shasum -a 256 -c SHA256SUMS
          assets=(diskr-aarch64-apple-darwin.tar.gz diskr-x86_64-apple-darwin.tar.gz SHA256SUMS install-diskr.sh diskr.rb distribution.json)
          if [ -f diskr-aarch64-apple-darwin.dmg ]; then
            assets+=(diskr-aarch64-apple-darwin.dmg diskr-x86_64-apple-darwin.dmg)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published assets" >&2
            exit 1
          fi
          test "$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -1 | cut -f1)" = "$RELEASE_SHA"
          gh release create "$RELEASE_TAG" --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${assets[@]}"

  refresh-site:
    needs: publish
    if: "!cancelled() && needs.publish.result == 'success'"
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Validate and deploy the website after release publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
