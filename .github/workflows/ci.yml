name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --locked

  rust:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify private maintenance docs stay untracked
        run: |
          for path in AGENTS.md CLAUDE.md docs/AUDIT.md docs/ISSUES.md; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "$path is private maintenance material and must not be tracked" >&2
              exit 1
            fi
          done
          if [ -n "$(git ls-files docs/internal)" ]; then
            echo "docs/internal is private maintenance material and must not be tracked" >&2
            exit 1
          fi
          if git grep -nE '(issue +#[0-9]+|audit finding|finding +#[0-9]+)' -- '*.rs'; then
            echo "tracked source must not expose private tracker references" >&2
            exit 1
          fi
          if git log -1 --pretty=%s | grep -Eq '(#[0-9]+|audit finding)'; then
            echo "commit subject exposes private tracker metadata" >&2
            exit 1
          fi
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked
      - run: cargo build --locked
      - run: ./target/debug/diskr --help
      - name: Compare read-only volume and subdirectory discovery
        run: |
          ./target/debug/diskr --space --json "$RUNNER_TEMP" > "$RUNNER_TEMP/space.json"
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "space.json").read_text())
          assert Path(report["mount"]).is_absolute()
          if report["filesystem"] == "apfs":
              assert report["apfs_container"] is not None or report["apfs_diagnostic"] is not None
          results = []
          for selected in [os.environ["RUNNER_TEMP"], report["mount"]]:
              output = subprocess.run(["tmutil", "listlocalsnapshots", selected], capture_output=True, text=True, timeout=20)
              names = sorted(line.strip() for line in output.stdout.splitlines() if line.strip() and not line.startswith("Snapshots for "))
              results.append({"status": output.returncode, "names": names})
          print(json.dumps({"macos": platform.mac_ver()[0], "architecture": platform.machine(), "mount": report["mount"], "subdirectory": results[0], "volume": results[1], "equal": results[0] == results[1]}, indent=2))
          PY

  unsupported-platform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup toolchain install stable --profile minimal
      - name: Verify explicit unsupported-target diagnostic
        run: |
          if cargo check --locked > "$RUNNER_TEMP/check.log" 2>&1; then
            echo "Linux unexpectedly compiled" >&2
            exit 1
          fi
          grep -F "unsupported target: diskr requires macOS" "$RUNNER_TEMP/check.log"
