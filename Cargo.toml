[package]
name = "diskr"
version = "0.1.84"
edition = "2021"
rust-version = "1.88"
authors = ["Milo Evans"]
description = "Fast macOS disk explorer for the terminal: see where your space went and what is safe to reclaim"
license = "MIT"
repository = "https://github.com/milobeans/diskr"
homepage = "https://milobeans.github.io/diskr/"
documentation = "https://milobeans.github.io/diskr/docs/"
readme = "README.md"
keywords = ["disk-usage", "storage", "tui", "macos", "apfs"]
categories = ["command-line-utilities", "filesystem"]
exclude = [".github/assets/", "scripts/", "site/", "Formula/"]

[dependencies]
ratatui-core = { version = "0.1", features = ["std"] }
ratatui-widgets = { version = "0.3", default-features = false, features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
anyhow = "1"
libc = "0.2" # macOS getattrlistbulk/open/close FFI
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["parse", "std", "serde"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
